<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Formula Universe / my-tools-matrix
  CJK font aliasing for high-fidelity Word->PDF conversion.

  The SOONTOP quotation (and most Taiwanese .docx) reference Windows-only
  Traditional-Chinese fonts (標楷體 / 新細明體 / 華康粗明體). On the Linux
  server these do not exist, so LibreOffice falls back to Noto Sans CJK,
  which is a WIDER, HEAVIER black-body (黑體) face. The wider glyph advance
  widths inflate every line, overflow fixed-width table cells and push the
  layout out of place ("字體膨脹位移").

  We map those names to AR PL UKai/UMing (and TW-Kai/TW-Sung), which are
  Traditional-Chinese Kaiti/Mingti faces whose proportions closely match the
  original Windows fonts. This keeps glyph widths near the source so the PDF
  matches the Smallpdf gold standard.
-->
<fontconfig>

  <!-- 標楷體 (DFKai-SB / BiauKai): Kaiti -> AR PL UKai TW, then TW-Kai -->
  <match target="pattern">
    <test name="family"><string>標楷體</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>AR PL UKai TW</string>
      <string>TW-Kai</string>
      <string>AR PL UKai HK</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>DFKai-SB</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>AR PL UKai TW</string>
      <string>TW-Kai</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>BiauKai</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>AR PL UKai TW</string>
      <string>TW-Kai</string>
    </edit>
  </match>

  <!-- 新細明體 / 細明體 (PMingLiU / MingLiU): Mingti -> AR PL UMing TW, TW-Sung -->
  <match target="pattern">
    <test name="family"><string>新細明體</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>AR PL UMing TW</string>
      <string>TW-Sung</string>
      <string>AR PL UMing HK</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>細明體</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>AR PL UMing TW</string>
      <string>TW-Sung</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PMingLiU</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>AR PL UMing TW</string>
      <string>TW-Sung</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>MingLiU</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>AR PL UMing TW</string>
      <string>TW-Sung</string>
    </edit>
  </match>

  <!-- 華康粗明體 (DFPMingBold): a bold Mingti -> AR PL UMing TW -->
  <match target="pattern">
    <test name="family"><string>華康粗明體</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>AR PL UMing TW</string>
      <string>TW-Sung</string>
    </edit>
  </match>

  <!-- Ensure a sane Traditional-Chinese default fallback order so any other
       unmatched CJK text prefers TW Mingti over Noto's heavier black face. -->
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>AR PL UMing TW</string>
      <string>TW-Sung</string>
    </edit>
  </match>

</fontconfig>
