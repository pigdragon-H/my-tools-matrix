providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]
# High-fidelity Word→PDF needs the LibreOffice Writer layout engine plus CJK
# fonts so 繁/簡/日/韓 render correctly in the exported vector PDF.
# Installed via apt on the Debian-based Nixpacks image (most reliable for
# LibreOffice + system fonts).
#
# CRITICAL for Traditional-Chinese fidelity:
#   The SOONTOP quotation references Windows-only fonts (標楷體/新細明體/
#   華康粗明體). Without close substitutes LibreOffice falls back to the
#   heavier/wider Noto Sans CJK black face, which inflates every line and
#   overflows the fixed-width quotation table ("字體膨脹位移"). The AR PL
#   UKai/UMing and TW-Kai/TW-Sung faces are Traditional-Chinese Kaiti/Mingti
#   fonts whose glyph widths closely match the original Windows fonts, so the
#   exported PDF matches the Smallpdf gold standard. A fontconfig alias
#   (installed at server startup, see server/lib/fontSetup.ts) maps the
#   Windows font names onto these faces.
aptPkgs = [
  "libreoffice-writer",
  "libreoffice-core",
  # PDF -> Word needs the Draw PDF import filter (libreoffice-draw) so
  # `--infilter=writer_pdf_import` is available; without it the .docx export
  # falls back to a blank document.
  "libreoffice-draw",
  "fonts-noto-cjk",
  "fonts-noto-cjk-extra",
  "fonts-wqy-zenhei",
  "fonts-arphic-ukai",
  "fonts-arphic-uming",
  "fonts-cns11643-kai",
  "fonts-cns11643-sung",
  "fontconfig",
  # poppler-utils: pdftotext (text-layer detection), pdfinfo (page count),
  # pdftoppm (rasterise for OCR), pdfunite (merge OCR pages).
  "poppler-utils",
  # tesseract OCR for scanned / image-only PDFs (no text layer). Traditional +
  # Simplified Chinese + English language data so CJK scans are recognised.
  "tesseract-ocr",
  "tesseract-ocr-chi-tra",
  "tesseract-ocr-chi-sim",
  "tesseract-ocr-eng",
  # PDF -> Word PRIMARY engine: pdf2docx (Python). Performs semantic
  # reconstruction (real paragraphs + real tables + real embedded images) so
  # the .docx opens faithfully in Microsoft Word, unlike LibreOffice's
  # floating-text-box output. Needs python3 + pip + build headers for PyMuPDF.
  "python3",
  "python3-pip",
  "python3-dev",
  "build-essential",
]

# Install the pdf2docx Python engine (PyMuPDF / python-docx) in a dedicated
# phase that runs AFTER the auto-detected Node install, so we don't disturb
# pnpm dependency resolution. `--break-system-packages` is required on
# Debian's externally-managed Python environment.
[phases.pyengine]
dependsOn = ["install"]
cmds = [
  "python3 -m pip install --break-system-packages --no-cache-dir 'pdf2docx==0.5.8'",
]
