providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]
# This deployment hosts two server-side converters:
#
#   1. Word -> PDF : LibreOffice Writer's layout engine + CJK fonts (vector PDF).
#   2. PDF  -> Word: the pdf2docx Python engine, which performs *structural*
#                    recovery (real paragraphs + real <w:tbl> tables) rather
#                    than LibreOffice's PDF import filter, whose visual-fidelity
#                    output is ~150 floating text boxes + 0 real tables and is
#                    effectively un-editable.
#
# CRITICAL for Traditional-Chinese fidelity (Word->PDF):
#   The SOONTOP quotation references Windows-only fonts (標楷體/新細明體/
#   華康粗明體). Without close substitutes LibreOffice falls back to the
#   heavier/wider Noto Sans CJK black face, which inflates every line and
#   overflows the fixed-width quotation table ("字體膨脹位移"). The AR PL
#   UKai/UMing and TW-Kai/TW-Sung faces are Traditional-Chinese Kaiti/Mingti
#   fonts whose glyph widths closely match the original Windows fonts. A
#   fontconfig alias (installed at server startup, see server/lib/fontSetup.ts)
#   maps the Windows font names onto these faces.
#
# python3 + python3-pip provide the runtime for the pdf2docx worker; the actual
# pdf2docx wheel (and its PyMuPDF / python-docx deps) is installed in the
# install phase below so it lands in the build image.
aptPkgs = [
  "libreoffice-writer",
  "libreoffice-core",
  "fonts-noto-cjk",
  "fonts-noto-cjk-extra",
  "fonts-wqy-zenhei",
  "fonts-arphic-ukai",
  "fonts-arphic-uming",
  "fonts-cns11643-kai",
  "fonts-cns11643-sung",
  "fontconfig",
  "fonts-noto-color-emoji",
  "python3",
  "python3-pip",
]

# IMPORTANT: do NOT override [phases.install] here. The project is managed with
# pnpm (pnpm-lock.yaml + packageManager: pnpm@10.4.1). Nixpacks auto-generates
# the correct `pnpm install` for the install phase; replacing it with npm would
# break the dependency tree and fail the build (Railway would then keep serving
# the previous deploy). Instead we add the Python engine in a SEPARATE phase
# that runs AFTER install, leaving the Node install flow untouched.
#
# `--break-system-packages` is required on Debian/PEP-668 images to install into
# the system Python; this build image is single-purpose so that is safe.
# The router uses three Python workers:
#   * pdf2docx_worker.py    -> pdf2docx (structural recovery: real tables)
#   * overlay_worker.py     -> PyMuPDF (fitz) + python-docx + Pillow
#                              (text-over-image dual layer: faithful + editable)
#   * pdf_classify_worker.py-> PyMuPDF (fitz) only
# PyMuPDF is pulled in by pdf2docx; we pin it explicitly alongside python-docx
# and Pillow so the overlay engine has all of its deps in the build image.
[phases.pyengine]
dependsOn = ["install"]
cmds = [
  "python3 -m pip install --no-cache-dir --break-system-packages 'pdf2docx==0.5.13' 'PyMuPDF==1.27.2' 'python-docx==1.1.2' 'Pillow>=10.0.0'",
]
