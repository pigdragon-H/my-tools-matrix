name: Build & Check

on:
  push:
    branches:
      - fix/build-memory-ssr-noindex
  pull_request:
    branches:
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript check
        run: npm run check

      - name: Run build
        run: npm run build

      - name: Verify SEO meta tags
        run: |
          echo '=== BMI Calculator title ==='
          grep -A1 '<title>' dist/public/tools/health/bmi-calculator/index.html
          echo ''
          echo '=== BMI Calculator description ==='
          grep 'name="description"' dist/public/tools/health/bmi-calculator/index.html
          echo ''
          echo '=== Compound Interest Calculator title ==='
          grep -A1 '<title>' dist/public/tools/finance/compound-interest-calculator/index.html
          echo ''
          echo '=== Compound Interest Calculator description ==='
          grep 'name="description"' dist/public/tools/finance/compound-interest-calculator/index.html
          echo ''
          echo '=== Non-whitelist page (BMI) robots meta ==='
          grep 'name="robots"' dist/public/tools/health/bmi-calculator/index.html || echo 'No robots meta found'

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
