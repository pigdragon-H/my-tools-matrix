name: Build & Check

on:
  push:
    branches:
      - fix/build-memory-ssr-noindex
      - fix/robots-meta-whitelist-fix
      - fix/ssr-suspense-streaming
  pull_request:
    branches:
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript check
        run: npm run check

      - name: Run build
        run: npm run build

      - name: Verify SEO meta tags (prerendered pages)
        run: |
          echo '=== BMI Calculator title ==='
          grep -A1 '<title>' dist/public/tools/health/bmi-calculator/index.html
          echo ''
          echo '=== BMI Calculator description ==='
          grep 'name="description"' dist/public/tools/health/bmi-calculator/index.html
          echo ''
          echo '=== Compound Interest Calculator title ==='
          grep -A1 '<title>' dist/public/tools/finance/compound-interest-calculator/index.html
          echo ''
          echo '=== Compound Interest Calculator description ==='
          grep 'name="description"' dist/public/tools/finance/compound-interest-calculator/index.html

      - name: Verify SSR Suspense content completeness
        run: |
          echo '=== 完整看一次root內容，確認FAQ區塊 ==='
          python3 -c "
          content = open('dist/public/tools/finance/compound-interest-calculator/index.html', encoding='utf-8').read()
          idx = content.find('<div id=\"root\">')
          print(content[idx:idx+3000] if idx >= 0 else 'NOT FOUND')
          "

          echo ''
          echo '=== 換用grep -P支援interval語法找FAQ區塊 ==='
          grep -oP '.{0,50}[Ff][Aa][Qq].{0,50}' dist/public/tools/finance/compound-interest-calculator/index.html | head -5 || echo "No FAQ(英文) found"
          grep -oP '.{0,50}常見.{0,50}' dist/public/tools/finance/compound-interest-calculator/index.html | head -5 || echo "No 常見 found"

          echo ''
          echo '=== 是否包含真正的公式內容（FV = P）==='
          grep -c "FV = P" dist/public/tools/finance/compound-interest-calculator/index.html || echo "0"

          echo ''
          echo '=== title/description仍然正確 ==='
          grep -A1 "<title>" dist/public/tools/health/bmi-calculator/index.html || echo "title NOT FOUND"
          grep 'name="description"' dist/public/tools/health/bmi-calculator/index.html || echo "description NOT FOUND"

      - name: Start server and verify fallback noindex
        run: |
          # Start server in background
          npm run start &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 3
          
          # Test whitelist page (BMI) - should NOT have noindex
          echo '=== Whitelist page (BMI) - should NOT have noindex ==='
          curl -s http://localhost:3000/tools/health/bmi-calculator | grep -i 'name="robots"' || echo 'No robots meta (expected for whitelist pages)'
          echo ''
          
          # Test non-whitelist page (Rental Yield) - should have noindex,follow
          echo '=== Non-whitelist page (Rental Yield) - should have noindex,follow ==='
          curl -s http://localhost:3000/tools/finance/rental-yield-calculator | grep -i 'name="robots"'
          echo ''
          
          # Kill server
          kill $SERVER_PID 2>/dev/null || true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
